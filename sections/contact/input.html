<div class="text-input text-input--filled-darker" data-field="{{name}}">
  <label class="text-input__label" for="{{id}}">{{label}}{{required_mark}}</label>
  <div class="text-input__field"><div class="text-input__inner"><input class="text-input__input" type="{{type}}" id="{{id}}" name="{{name}}" placeholder="{{placeholder}}" autocomplete="{{autocomplete}}" maxlength="{{maxlength}}" aria-describedby="{{id}}-error"{{attributes}}></div></div>
  <p class="form-field-error" id="{{id}}-error" hidden></p>
</div>
