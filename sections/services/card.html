<div class="card" role="group" aria-labelledby="{{id}}-title">
  <div class="card__content">
    <h3 class="card__title" id="{{id}}-title">{{title}}</h3>
    <p class="card__body">{{description}}</p>
  </div>
  <div class="card__actions"><a class="link link--inline" href="{{href}}">{{action}}</a></div>
</div>
