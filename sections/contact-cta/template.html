<section class="contact-cta" aria-labelledby="contact-cta-title">
  <div class="ds-container">
    <div class="card">
      <span class="home-feature-icon" aria-hidden="true"><img src="templates/faq/assets/contact.svg" width="22" height="19" alt=""></span>
      <div class="card__content">
        <h2 class="card__title" id="contact-cta-title">{{title}}</h2>
        <p class="card__body">{{description}}</p>
      </div>
      <div class="card__actions"><a class="btn btn--primary btn--lg" href="{{href}}">{{label}}</a></div>
    </div>
  </div>
</section>
