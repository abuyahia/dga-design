<article class="heavy-content" data-heavy-content>
  <div class="ds-container heavy-content__container">
    <header class="heavy-content__header">
      {{breadcrumb}}
      <h1 id="page-title">{{title}}</h1>
      <p class="heavy-content__lead">{{description}}</p>
      <p class="heavy-content__overview">{{overview}}</p>
    </header>
    <hr class="divider" role="none" aria-hidden="true">
    <div class="heavy-content__layout">
      {{toc}}
      <div class="heavy-content__body">{{sections}}</div>
    </div>
  </div>
</article>
<script src="templates/content/content.js" defer></script>
