<div class="card" role="group" aria-labelledby="{{id}}-title">
  <img class="news-image" src="assets/templates/home/news.png" alt="علم المملكة العربية السعودية" width="384" height="250" loading="lazy">
  <div class="card__content"><h3 class="card__title" id="{{id}}-title">{{title}}</h3><p class="card__body">{{description}}</p></div>
  <div class="card__actions"><a class="btn btn--primary" href="news.html#{{id}}"><span class="btn__text">قراءة المزيد<span class="sr-only">: {{title}}</span></span></a></div>
</div>
