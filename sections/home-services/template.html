<section id="services" class="home-section home-section--muted" aria-labelledby="services-title">
  <div class="ds-container ds-stack">
    <div class="section-heading"><h2 id="services-title">{{heading}}</h2><a class="btn btn--secondary-outline" href="services.html"><span class="btn__text">عرض الكل</span></a></div>
    <p class="section-description">{{description}}</p>
    <div data-carousel>
      <div class="home-carousel home-carousel--services" id="services-track" tabindex="0" role="region" aria-label="بطاقات الخدمات">{{cards}}</div>
      <div class="carousel-controls" hidden><div class="ds-cluster"><button class="btn btn--secondary-outline" type="button" data-prev aria-controls="services-track" aria-label="الخدمات السابقة">السابق</button><button class="btn btn--primary" type="button" data-next aria-controls="services-track" aria-label="الخدمات التالية">التالي</button></div><span dir="ltr" data-position aria-live="polite"></span></div>
    </div>
  </div>
</section>
