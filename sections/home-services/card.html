<div class="card" role="group" aria-labelledby="{{id}}-title">
  <span class="home-feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span>
  <div class="card__content"><h3 class="card__title" id="{{id}}-title">{{title}}</h3><p class="card__body">{{description}}</p></div>
  <div class="ds-cluster"><span class="tag tag--sm tag--success">إلكترونية</span><span class="tag tag--sm tag--info">أفراد</span></div>
  <div class="card__actions"><a class="btn btn--primary" href="services.html#{{id}}"><span class="btn__text">تفاصيل الخدمة</span></a></div>
</div>
