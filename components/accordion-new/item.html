<div class="accordion">
  <h3 class="accordion__heading"><button data-initial-expanded="false" disabled data-enhancement-disabled
    class="accordion__trigger"
    type="button"
    id="accordion-trigger-{{id}}"
    aria-expanded="true"
    aria-controls="accordion-panel-{{id}}"
  >
    <span class="accordion__title">{{question}}</span>
    <svg class="accordion__icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
      <path d="M3.5 6l4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button></h3>
  <div
    class="accordion__panel"
    id="accordion-panel-{{id}}"
    role="region"
    aria-labelledby="accordion-trigger-{{id}}"
  >
    <div class="accordion__body">
      {{answer}}
    </div>
  </div>
</div>
