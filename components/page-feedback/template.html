<section class="page-feedback feedback" data-feedback-component="page" data-feedback-id="{{subject}}" aria-labelledby="{{id}}-title"><div class="feedback-container"><div class="feedback-summary"><div class="feedback-question"><h2 id="{{id}}-title">هل كانت هذه الصفحة مفيدة؟</h2><div class="feedback-choices"><button class="btn btn--primary" type="button" data-feedback="yes" aria-pressed="false" aria-expanded="false" aria-controls="{{id}}-form" hidden>نعم</button><button class="btn btn--primary" type="button" data-feedback="no" aria-pressed="false" aria-expanded="false" aria-controls="{{id}}-form" hidden>لا</button></div></div>{{statistics}}</div><form id="{{id}}-form" class="feedback-form" hidden><button class="btn btn--subtle feedback-close" type="button" data-feedback-close>إغلاق<img src="components/page-feedback/assets/close.svg" width="22" height="22" alt=""></button><div class="feedback-body"><div><fieldset class="feedback-reasons"><legend>من فضلك أخبرنا بالسبب (حدد ما يصل إلى خيارين)</legend>{{reasons}}</fieldset><fieldset class="feedback-gender"><legend>أنا (اختياري):</legend>{{gender_options}}</fieldset></div><div class="text-input feedback-comment"><label class="text-input__label" for="{{id}}-comment">{{comment_label}} (اختياري)</label><div class="text-input__field"><textarea class="text-input__input" id="{{id}}-comment" name="comment" rows="3" maxlength="1000" placeholder="النص المدخل"></textarea></div></div></div><p class="feedback-note" id="{{id}}-note">معاينة محلية: لا يُرسل التقييم أو يُحفظ على خادم.</p><p class="feedback-error" role="alert" hidden></p><div class="feedback-bottom"><p>لمزيد من المعلومات يمكنك مراجعة <a class="link link--inline" href="https://my.gov.sa/ar/content/e-participation#section-1">بيان المشاركة الإلكترونية</a> و<a class="link link--inline" href="https://my.gov.sa/ar/content/subscribe#section-1">قواعد الاشتراك</a>.</p><button class="btn btn--primary" type="submit" aria-describedby="{{id}}-note">إرسال</button></div></form><div class="feedback-result" tabindex="-1" hidden><p class="feedback-result-value"></p><p class="feedback-status" role="status"></p></div><noscript><p>يتطلب إرسال التقييم تشغيل JavaScript.</p></noscript></div></section>
