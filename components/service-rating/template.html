<section class="service-rating feedback" data-feedback-component="service" data-feedback-id="{{subject}}" aria-label="تقييم الخدمة"><div class="feedback-container"><div class="feedback-summary"><div class="service-rating-summary">{{statistics}}</div><button class="btn btn--primary" type="button" data-rating-open aria-expanded="false" aria-controls="{{id}}-form" hidden>قيّم هذه الخدمة</button></div><form id="{{id}}-form" class="feedback-form" hidden><div class="feedback-heading"><div><h2>أخبرنا عن رأيك في هذه الخدمة</h2><p id="{{id}}-note" class="feedback-note">معاينة محلية: لا يُرسل التقييم أو يُحفظ على خادم.</p></div><button class="btn btn--subtle feedback-close" type="button" data-feedback-close>إغلاق<img src="components/service-rating/assets/open-imgElements.svg" width="22" height="22" alt=""></button></div><div class="feedback-body"><fieldset class="service-rating-input"><legend>كيف تقيم هذه الخدمة؟</legend><p id="{{id}}-scale">قيّم تجربتك من (1) ضعيف إلى (5) ممتاز</p><div class="rating rating--md rating--brand" aria-describedby="{{id}}-scale" dir="ltr">{{stars}}</div></fieldset><div class="text-input feedback-comment"><label class="text-input__label" for="{{id}}-comment">{{comment_label}} (اختياري)</label><div class="text-input__field"><textarea class="text-input__input" id="{{id}}-comment" name="comment" rows="3" maxlength="1000" placeholder="النص المدخل"></textarea></div></div></div><p class="feedback-error" role="alert" hidden></p><div class="feedback-bottom"><p>لمزيد من المعلومات يمكنك مراجعة <a class="link link--inline" href="https://my.gov.sa/ar/content/e-participation#section-1">بيان المشاركة الإلكترونية</a> و<a class="link link--inline" href="https://my.gov.sa/ar/content/subscribe#section-1">قواعد الاشتراك</a>.</p><button class="btn btn--primary" type="submit" aria-describedby="{{id}}-note">إرسال</button></div></form><div class="feedback-result" tabindex="-1" hidden><p class="feedback-result-value"></p><p class="feedback-status" role="status"></p></div><noscript><p>يتطلب إرسال التقييم تشغيل JavaScript.</p></noscript></div></section>
