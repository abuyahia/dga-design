    <li class="progress-indicator__item {{state_class}}" data-progress-step="{{index}}"{{current_attribute}}>
      <span class="progress-indicator__marker" aria-hidden="true">
        <svg class="progress-indicator__check" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.4 6.2 11.5 13 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="progress-indicator__number">{{index}}</span>
      </span>
      <span class="progress-indicator__copy">
        <strong>{{title}}</strong>
        <span>{{description}}</span>
      </span>
    </li>
