<div class="text-input text-input--filled-darker textarea" data-field="{{name}}">
  <label class="text-input__label" for="{{id}}">{{label}}</label>
  <div class="text-input__field"><textarea class="text-input__input textarea__control" id="{{id}}" name="{{name}}" rows="3" maxlength="2000" placeholder="{{placeholder}}" aria-describedby="{{id}}-error"{{attributes}}></textarea></div>
  <p class="form-field-error" id="{{id}}-error" hidden></p>
</div>
